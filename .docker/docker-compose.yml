version: "3.9"

services:

  app:
    build: .
    container_name: email-app
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - storage:/app/storage

  queue:
    build: .
    container_name: email-queue
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redi
    command: php artisan queue:work --tries=3
    volumes:
      - storage:/app/storage

  scheduler:
    build: .
    container_name: email-scheduler
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - storage:/app/storage

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: secret
    volumes:

      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data

volumes:
  postgres:
  redis:
  storage: